# Nginx reverse proxy for Diogenes Travel Panel
# Enforces IP whitelist at the edge so that unauthorized clients
# never reach the backend or frontend apps.

upstream diogenes_backend {
    server 127.0.0.1:8001;
}

upstream diogenes_frontend {
    server 127.0.0.1:3000;
}

# Whitelisted IPs
geo $allowed_ip {
    default 0;
    217.131.25.91 1;
    127.0.0.1 1;
    ::1 1;
}

# Preserve original client IPs when behind another proxy
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    # Show the React access denied page with 403 status for blocked IPs
    error_page 403 =403 @access_denied;
    proxy_intercept_errors on;

    # Shared proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # API requests → backend
    location /api/ {
        allow 217.131.25.91;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://diogenes_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Frontend routes (including /login)
    location / {
        allow 217.131.25.91;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://diogenes_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Access denied renderer - serves standalone static HTML but keeps 403 status
    location @access_denied {
        proxy_pass http://diogenes_frontend/access-denied.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
